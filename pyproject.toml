[project]
name = "network-automation"
version = "0.1.0"
description = "Network automation framework for Cisco and Eltex using Python, NAPALM, and Netmiko"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AbramJenkingarten"}
]
dependencies = [
    "napalm>=5.0.0",
    "netmiko>=4.3.0",
    "pyyaml>=6.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
]
cisco = [
    "napalm-iosxr>=0.4.0",
]
eltex = [
    "netmiko>=4.3.0",
]

[project.urls]
Homepage = "https://github.com/AbramJenkingarten/network-automation"
Repository = "https://github.com/AbramJenkingarten/network-automation"
Issues = "https://github.com/AbramJenkingarten/network-automation/issues"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W", "UP", "B", "C4", "PTH", "T20"]
ignore = ["E501", "B008"]
exclude = [".git", "__pycache__", ".venv", "dist", "build"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true
exclude = ["tests/", ".venv/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
net-auto = "network_automation.cli:app"